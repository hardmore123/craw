# 证书核对工具 · Nginx 纯反向代理配置
#
# 关键设计（借鉴 CertAgent 部署教训）：
#   nginx 只做 proxy_pass，不直接读任何文件。
#   静态页由后端 Python（cert_verify.web）自己托管，
#   因此不会出现 CertAgent 那种 www-data 读 /home/hisense/.../dist 的
#   ACL / 权限 500 问题。
#
# 前提：后端服务改为只监听本机 127.0.0.1:8756（见 certverify.service 说明），
#       nginx 对外监听 80（或按需 8756）。
#
# 安装：
#   sudo cp Linux/deploy/nginx-certverify.conf /etc/nginx/sites-available/certverify
#   sudo ln -sf /etc/nginx/sites-available/certverify /etc/nginx/sites-enabled/certverify
#   sudo rm -f /etc/nginx/sites-enabled/default     # 如需去掉默认站点
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # 上传报备清单可能较大，放宽限制（与后端一致，够用即可）
    client_max_body_size 50m;

    # 全量核对是后台线程 + 前端轮询 /api/progress，单请求本身不长；
    # 但上传大文件 + 解密兜底可能耗时，放宽超时避免 502。
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://127.0.0.1:8756;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
