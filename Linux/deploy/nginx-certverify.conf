# 证书核对工具 · Nginx 反向代理配置（子路径 /craw 版）
#
# 访问地址：http://10.18.87.51:8756/craw/
#
# 关键设计（借鉴 CertAgent 部署教训）：
#   nginx 只做 proxy_pass，不直接读任何文件。静态页由后端 Python 自己托管，
#   因此不会出现 www-data 读 dist 的 ACL / 500 权限问题。
#
# 端口关系（重要）：
#   - 后端 cert_verify.web 监听 127.0.0.1:8757（内部，见 certverify.service）
#   - nginx 对外监听 8756，把 /craw/ 和 /api/ 转发到后端
#   - 之所以后端用 8757：nginx 要占用对外的 8756，二者不能同端口
#
# 前端资源是相对路径、接口是绝对 /api/，所以必须同时配置：
#   /craw/  → 去掉前缀转发到后端根（页面 + style.css + app.js）
#   /api/   → 转发到后端（app.js 里写死的 fetch("/api/...")）
#
# 安装：
#   sudo cp Linux/deploy/nginx-certverify.conf /etc/nginx/sites-available/certverify
#   sudo sed -i 's/server_name _;/server_name 10.18.87.51;/' /etc/nginx/sites-available/certverify
#   sudo ln -sf /etc/nginx/sites-available/certverify /etc/nginx/sites-enabled/certverify
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8756;
    server_name _;

    client_max_body_size 50m;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 裸访问 /craw 自动补斜杠，保证相对资源正确解析
    location = /craw { return 301 /craw/; }

    # 页面与静态资源：去掉 /craw 前缀后转发到后端根
    location /craw/ {
        rewrite ^/craw/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8757;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API（app.js 里是绝对路径 /api/...）转发到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8757;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
