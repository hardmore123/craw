# 证书核对工具 · Nginx 反向代理（做法 B 备用配置）
# 当前生产采用做法 A：Nginx 共用 80 端口，访问 http://10.18.87.51/craw/
# 本文件仅在 /api/ 与既有 80 站点冲突时使用：外部端口 8757，
# 内部 Python 后端 127.0.0.1:8758。不要与做法 A 同时启用。
# Nginx 只做 proxy_pass，不直接读取项目文件；静态页由 Python 托管。

server {
    listen 8757;
    server_name 10.18.87.51 _;

    client_max_body_size 50m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 正式页面入口：去掉 /craw 前缀后交给后端根路径。
    location = /craw {
        return 301 /craw/;
    }
    location /craw/ {
        rewrite ^/craw/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8758;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # app.js 按当前页面拼接相对 API；/craw/api/... 经上面的 /craw/ 转发，
    # 直接访问根路径时的 /api/... 由本 location 兼容。
    location /api/ {
        proxy_pass http://127.0.0.1:8758;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 禁止把根路径误当成正式入口，避免访问地址混乱。
    location / {
        return 404;
    }
}
